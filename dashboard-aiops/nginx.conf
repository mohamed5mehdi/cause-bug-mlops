# dashboard-aiops : nginx sert le build React et relaie /api/* vers aiops-engine (ADR-014).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # La barre finale retire le prefixe : /api/health -> http://aiops-engine:8000/health
        proxy_pass http://aiops-engine:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Au-dela du budget de POST /diagnose (130 s, ADR-015) : le defaut de 60 s
        # couperait un diagnostic encore en cours.
        proxy_read_timeout 140s;
    }

    location / {
        # Application monopage : toute route inconnue renvoie index.html.
        try_files $uri $uri/ /index.html;
    }
}
