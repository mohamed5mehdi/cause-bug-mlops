name: Demo statique (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'dashboard-aiops/**'
      - '.github/workflows/demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-aiops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard-aiops/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit && npx eslint .
      - run: npx vite build --base=/cause-bug-mlops/
        env:
          VITE_DEMO: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard-aiops/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
