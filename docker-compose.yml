# Cause.Bug.MLOps - pile locale
# Lancement : copier .env.example en .env, renseigner les mots de passe, puis
#   docker compose up -d --build
name: cause-bug-mlops

services:
  postgres:
    # PostgreSQL 16 avec l'extension pgvector (utilisee par aiops-engine a partir de J6).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: causebugmlops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      ERP_APP_PASSWORD: ${ERP_APP_PASSWORD:?ERP_APP_PASSWORD manquant dans .env}
      AIOPS_READER_PASSWORD: ${AIOPS_READER_PASSWORD:?AIOPS_READER_PASSWORD manquant dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Port hote 5435 : evite les conflits avec un PostgreSQL local (5432) et la base de tests (5433).
      - "${PG_HOST_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d causebugmlops"]
      interval: 5s
      timeout: 3s
      retries: 10

  erp-simule:
    build: ./erp-simule
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Profil demo : charge les donnees de demonstration (utilisateurs, fournisseurs, budgets).
      SPRING_PROFILES_ACTIVE: demo
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: causebugmlops
      DB_USER: erp_app
      DB_PASSWORD: ${ERP_APP_PASSWORD:?ERP_APP_PASSWORD manquant dans .env}
    ports:
      - "${ERP_HOST_PORT:-8080}:8080"
    # Sonde de sante : HEALTHCHECK du Dockerfile d'erp-simule (actuator).

  aiops-engine:
    build:
      context: ./aiops-engine
      target: runtime
    depends_on:
      # erp-simule applique les migrations Flyway, dont la table erp.trace_execution
      # qu'aiops-engine ecoute : il doit etre pret avant.
      erp-simule:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: causebugmlops
      DB_USER: aiops_reader
      DB_PASSWORD: ${AIOPS_READER_PASSWORD:?AIOPS_READER_PASSWORD manquant dans .env}
    ports:
      - "${AIOPS_HOST_PORT:-8000}:8000"

volumes:
  pgdata:
